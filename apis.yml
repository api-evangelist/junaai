aid: junaai
name: Juna.ai
description: 'Juna.ai is a Berlin-based industrial AI company building an Agentic Factory
  OS — a platform of autonomous AI agents that plan, steer, and continuously improve complex
  industrial production processes. Its agents ingest live plant data through integrations
  with existing IT/OT systems (SAP, Siemens, AVEVA, PI Server, Snowflake), model assets and
  processes into a Factory Graph and Knowledge Graph, detect anomalies, run root-cause analysis,
  generate reports, and recommend or execute control actions 24/7 with human-in-the-loop
  oversight and full traceability. Juna targets heavy and process industries including chemicals,
  cement, pulp & paper, glass, food & beverage, pharma, consumer goods, and industrial
  manufacturing, focused on maximizing output, quality, energy efficiency, and sustainability.
  The company is backed by Kleiner Perkins, Norrsken VC, and John Doerr. Juna delivers integration
  through enterprise engagements and does not currently publish a public developer API, SDK,
  or documentation portal.'
